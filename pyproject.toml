[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "plaudertaste"
version = "0.1.0"
description = "Push-to-Talk-Diktat für Windows – 100 % lokal mit Whisper."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.1",
    "numpy>=1.26",
    "pynput>=1.7",
    "pyperclip>=1.9",
    "PySide6-Essentials>=6.7",
    "sounddevice>=0.5",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
# cuBLAS für die GPU-Beschleunigung (CUDA 12). cuDNN bringt ctranslate2 selbst mit.
gpu = [
    "nvidia-cublas-cu12",
]
dev = [
    "pytest>=8",
    "ruff>=0.16",
]

[project.scripts]
plaudertaste = "plaudertaste.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W: Stil, F: echte Fehler (z. B. unbenutzte Namen), I: Import-Reihenfolge,
# B: typische Fallen, UP: moderne Python-Schreibweise, SIM: Vereinfachungen
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Frühwarnsystem: Veraltetes in unserem Code und Fehler in Audio-/Hintergrund-Callbacks
# lassen Tests scheitern, statt nur eine leicht übersehene Warnung auszugeben.
filterwarnings = [
    "error::DeprecationWarning:plaudertaste",
    "error::pytest.PytestUnraisableExceptionWarning",
]
